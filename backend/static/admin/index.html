<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CircleUp Admin | Command Center</title>
    <link rel="stylesheet" href="/static/admin/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="dashboard-container">
        <header class="top-bar">
            <div class="logo">
                <span class="logo-icon">C</span>
                <h1>CircleUp Admin</h1>
            </div>
            <div class="live-status">
                <div class="pulse"></div>
                <span id="live-label">LIVE OVERVIEW</span>
            </div>
            <div class="admin-mini-profile">
                <div class="admin-avatar">A</div>
                <div class="admin-name">Ayush</div>
                <button class="logout-btn" onclick="logout()" title="Change Token"><i data-lucide="log-out"></i></button>
            </div>
        </header>

        <main class="main-content">
            <!-- KPI Stats -->
            <section class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon users"><i data-lucide="users"></i></div>
                    <div class="stat-data">
                        <h3 id="total-users">--</h3>
                        <p>Neighbors</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon tools"><i data-lucide="hammer"></i></div>
                    <div class="stat-data">
                        <h3 id="total-tools">--</h3>
                        <p>Total Tools</p>
                    </div>
                </div>
                <div class="stat-card accent">
                    <div class="stat-icon rentals"><i data-lucide="zap"></i></div>
                    <div class="stat-data">
                        <h3 id="active-rentals">--</h3>
                        <p>Live Rentals</p>
                    </div>
                </div>
            </section>

            <!-- Neighborhood Directory -->
            <section class="activity-section" style="margin-bottom: 2rem;">
                <div class="section-header">
                    <h3><i data-lucide="contact" style="display:inline; width:20px; height:20px; vertical-align:middle; margin-right:8px;"></i>Neighborhood Directory</h3>
                    <button class="refresh-btn" onclick="fetchUsers()"><i data-lucide="refresh-cw"></i> Refresh</button>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Neighbor</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Karma</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="users-log">
                            <tr><td colspan="7" style="text-align:center; color: var(--text-muted);">Loading neighbors...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- Global Activity Log -->
            <section class="activity-section">
                <div class="section-header">
                    <h3><i data-lucide="activity" style="display:inline; width:20px; height:20px; vertical-align:middle; margin-right:8px;"></i>Global Activity Log</h3>
                    <button class="refresh-btn" onclick="refreshData()"><i data-lucide="refresh-cw"></i> Refresh</button>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Neighbor</th>
                                <th>Action</th>
                                <th>Tool</th>
                                <th>Status</th>
                                <th>Time</th>
                                <th>Management</th>
                            </tr>
                        </thead>
                        <tbody id="activity-log">
                            <tr><td colspan="6" style="text-align:center; color: var(--text-muted);">Loading activity...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    <script src="/static/admin/app.js"></script>
</body>
</html>
